version: '3.8'

services:
  # WorldMonitor Frontend & Unified Proxy
  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      - VITE_VARIANT=${VITE_VARIANT:-full}
      - VITE_GEOSENTINEL_API=http://geosentinel:8000
      - VITE_WIRETAPPER_API=http://wiretapper:8080
      - VITE_PENTAGI_API=http://pentagi:8443
    networks:
      - monitor-network
    restart: always

  # GeoSentinel Backend
  geosentinel:
    build: ./backend/geosentinel
    expose:
      - "8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - DATA_DIR=/data
    volumes:
      - shared-intelligence:/data
    networks:
      - monitor-network
    restart: unless-stopped

  # WireTapper Backend
  wiretapper:
    build: ./backend/wiretapper
    expose:
      - "8080"
    environment:
      - WIGLE_API_NAME=${WIGLE_API_NAME:-}
      - WIGLE_API_TOKEN=${WIGLE_API_TOKEN:-}
      - OPENCELLID_API_KEY=${OPENCELLID_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
    networks:
      - monitor-network
    restart: unless-stopped

  # PentAGI Ecosystem
  pentagi:
    image: vxcontrol/pentagi:latest
    expose:
      - "8443"
    depends_on:
      - pgvector
      - neo4j
    environment:
      - DATABASE_URL=postgres://${PENTAGI_POSTGRES_USER:-postgres}:${PENTAGI_POSTGRES_PASSWORD:-postgres}@pgvector:5432/${PENTAGI_POSTGRES_DB:-pentagidb}?sslmode=disable
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - pentagi-data:/opt/pentagi/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitor-network
    restart: unless-stopped

  pgvector:
    image: vxcontrol/pgvector:latest
    environment:
      POSTGRES_USER: ${PENTAGI_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PENTAGI_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${PENTAGI_POSTGRES_DB:-pentagidb}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - monitor-network

  neo4j:
    image: neo4j:5.26.2
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-devpassword}
    volumes:
      - neo4j-data:/data
    networks:
      - monitor-network

  # PentestGPT Agent
  pentestgpt:
    build: ./backend/pentestgpt
    volumes:
      - ./backend/pentestgpt/workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  pentagi-data:
  pgvector-data:
  neo4j-data:
  shared-intelligence:
